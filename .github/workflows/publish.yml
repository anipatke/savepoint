name: Publish Package

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate distribution and CLI contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # This job is intentionally read-only: it builds, verifies, and packs
      # locally, but never publishes, tags, deploys, or writes a changelog.
      - run: make ci

  publish:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # On a branch push, publish only when package.json's version is not already
      # on the registry; npm rejects republishing an existing version, so without
      # this guard every merge that didn't bump the version would fail the job.
      # Tag pushes and manual dispatch always publish.
      - name: Check whether version needs publishing
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REMOTE=$(npm view savepoint@"$LOCAL" version 2>/dev/null || true)
          if [ -z "$REMOTE" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$LOCAL already on npm; nothing to publish."
          fi

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # npm gives every publish the "latest" tag unless told otherwise, so a
      # maintenance release on an older major (1.x while 2.x is current) would
      # become what `npx savepoint` installs. Publish an older major under its
      # own tag, legacy-<major> (npm rejects v<major>, which reads as a version
      # range), and leave "latest" alone. Same or newer majors, and
      # the first publish, still use "latest".
      - name: Choose npm dist-tag
        id: disttag
        if: steps.check.outputs.publish == 'true'
        run: |
          LOCAL="${{ steps.check.outputs.version }}"
          LATEST=$(npm view savepoint dist-tags.latest 2>/dev/null || true)
          LOCAL_MAJOR="${LOCAL%%.*}"
          LATEST_MAJOR="${LATEST%%.*}"
          TAG=latest
          if [ -n "$LATEST_MAJOR" ] && [ "$LOCAL_MAJOR" -lt "$LATEST_MAJOR" ]; then
            TAG="legacy-$LOCAL_MAJOR"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $LOCAL under dist-tag $TAG (latest is ${LATEST:-unset})."

      - run: npm publish --tag "${{ steps.disttag.outputs.tag }}"
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: v${{ steps.check.outputs.version }}

      # Record the release as a tag so history stays bisectable and the tag-push
      # path above still works for manual releases.
      - name: Tag the release
        if: steps.check.outputs.publish == 'true' && github.ref_type == 'branch'
        run: |
          VERSION="v${{ steps.check.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION already tagged."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
