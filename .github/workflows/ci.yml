name: CI

on:
  push:
    branches: [master, v2]
  pull_request:
    branches: [master, v2]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: make ci
