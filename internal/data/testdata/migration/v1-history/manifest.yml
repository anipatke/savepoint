# v1-history migration source fixture inventory.
#
# Every sha256 below was computed once, by hand, from the frozen bytes under
# project/, and is never regenerated by a test. A test that recomputes a
# fixture's hash and compares it only to itself proves nothing; comparing to
# this independently recorded value is what catches accidental fixture drift.
#
# To re-verify by hand: `sha256sum` each `path` below from this directory.
#
# Fields beyond path/sha256/role are hand-authored review annotations, not
# read by any test assertion (mirrors v1-basic/manifest.yml): scoped_id,
# raw_status, raw_phase, expected_stage_after_parse, depends_on, encoding,
# and expected_classification (here using the "history" vs "active"
# vocabulary directly, since this fixture's whole point is distinguishing
# archived-history records from still-active ones). Extra descriptive keys
# on finding/defect/run entries (proof_needed_summary, duplicate_of,
# disposition) are likewise for manual review only; the shared manifest
# parser ignores unknown keys.

fixture: v1-history
description: >
  A multi-release V1 project: the same epic (E01-example) and short Task ID
  (T001-shared) appear in both release v1 (done, resolved defect) and
  release v1.1 (in progress, open defect of the same short ID), proving
  same-epic dependency resolution must stay release-scoped. v1.1 adds a
  dependent follow-up Task (T002-follow-up), a full audit/ register with a
  fixed-but-unverified finding (F001), an owner-waived finding (F002), a
  finding explicitly marked duplicate of F001 (F003), one immutable audit
  run, an epic audit, and a short custom Health-Check.md procedure.

